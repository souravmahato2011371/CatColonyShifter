name: Prism Pop Android Builds

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK and Play bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android 36 platform
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Run release lint
        run: gradle --no-daemon lintRelease

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build Play Store Android App Bundle
        run: gradle --no-daemon bundleRelease

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prism-pop-release-candidate
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 30

      - name: Prepare public APK filename
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk PrismPop.apk

      - name: Publish public APK release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Prism Pop ${{ github.ref_name }}
          generate_release_notes: true
          files: PrismPop.apk
          fail_on_unmatched_files: true
