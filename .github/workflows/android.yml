name: Prism Pop Android Release Pipeline

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to receive PrismPop.apk (for example, PrismPop)
        required: true
        type: string
      source_ref:
        description: Branch, tag, or commit to build
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: prism-pop-android-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish Android packages
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve build source and release target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            SOURCE_REF="${{ inputs.source_ref }}"
            RELEASE_TAG="${{ inputs.release_tag }}"
          elif [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            SOURCE_REF="${{ github.event.release.tag_name }}"
            RELEASE_TAG="${{ github.event.release.tag_name }}"
          else
            SOURCE_REF="$GITHUB_REF"
            RELEASE_TAG=""
          fi
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Building source: $SOURCE_REF"
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "Target GitHub Release: $RELEASE_TAG"
          else
            echo "Main-branch build only; no public release upload."
          fi

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.source_ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Run release lint
        id: lint
        continue-on-error: true
        run: gradle --no-daemon lintRelease

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build release APK and Play Store bundle
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Prepare public APK
        if: steps.target.outputs.release_tag != ''
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk PrismPop.apk

      - name: Verify target GitHub Release exists
        if: steps.target.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Upload APK to GitHub Release
        if: steps.target.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" PrismPop.apk --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload build outputs to Actions
        uses: actions/upload-artifact@v4
        with:
          name: prism-pop-android-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/reports/lint-results-release.html
          if-no-files-found: warn
          retention-days: 30

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Prism Pop Android build"
            echo ""
            echo "- Source: `${{ steps.target.outputs.source_ref }}`"
            echo "- Release target: `${{ steps.target.outputs.release_tag || 'Actions artifact only' }}`"
            echo "- Debug APK: installable test build, signed with the default debug key"
            echo "- Release APK: unsigned output, not ready to install or publish"
            echo "- AAB: release bundle; Play Console upload requires a properly signed release"
            echo "- Lint: see the lint report artifact; lint does not block package creation"
          } >> "$GITHUB_STEP_SUMMARY"
