plugins {
    id 'com.android.application'
}

android {
    namespace 'com.prismpop.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.prismpop.game'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
